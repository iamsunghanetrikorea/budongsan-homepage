# GitHub Pages 배포: 공개용 파일만 _site 로 복사해서 배포합니다.
# 홈페이지와 관리자 화면(admin/)만 배포하고, PRD·디자인 원본 등은 제외합니다.
# 관리자 화면에는 비밀 정보가 없으며, 게시는 각 기기에 저장한 GitHub 토큰이 있어야 가능합니다.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 공개 파일만 _site 로 복사
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data assets admin _site/
          rm -f _site/data/properties.sample.json
          touch _site/.nojekyll
          # 캐시 무효화: CSS/JS 주소에 커밋 ID를 붙여 배포 직후에도 새 파일을 받게 함
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/admin/index.html
          echo "배포 파일 목록:" && find _site -type f | sort

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
